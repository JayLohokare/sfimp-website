<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#C4732B">
    <title>Videos — SF Indian Music Project</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="home2.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="h2-nav">
        <div class="container">
            <a href="home2.html" class="h2-nav-logo">SF<span>IMP</span></a>
            <div class="h2-nav-links">
                <a href="h2-events.html">Events</a>
                <a href="h2-about.html">About</a>
                <a href="h2-videos.html" class="active">Videos</a>
                <a href="h2-gallery.html">Gallery</a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="h2-page-header">
        <h1>Videos</h1>
        <p>Studio sessions, live jams, and musical moments</p>
    </div>

    <!-- Videos -->
    <section class="h2-section h2-videos-bg">
        <div class="container">
            <div class="h2-video-grid" id="h2-video-grid"></div>
            <div style="text-align:center; margin-top:2rem;">
                <a href="https://youtube.com/@sfindianmusicproject" target="_blank" class="h2-social-link" style="display:inline-flex;">
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.587 3.545 12 3.545 12 3.545s-7.587 0-9.376.505A3.017 3.017 0 00.502 6.186C0 7.973 0 12 0 12s0 4.027.502 5.814a3.016 3.016 0 002.122 2.136c1.789.505 9.376.505 9.376.505s7.587 0 9.376-.505a3.015 3.015 0 002.122-2.136c.502-1.787.502-5.814.502-5.814s0-4.027-.502-5.814zM9.461 8.751l5.99 3.434-5.99 3.434V8.751z"/></svg>
                    View All Videos on YouTube
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="h2-footer">
        <div class="container">
            <p>SF Indian Music Project INC (501c3)</p>
        </div>
    </footer>

    <script src="youtube_videos.js"></script>
    <script>
    (function() {
        const grid = document.getElementById('h2-video-grid');
        if (!grid || typeof youtubeVideos === 'undefined') return;
        grid.innerHTML = youtubeVideos.map(v => `
            <div class="h2-video-card">
                <iframe src="https://www.youtube.com/embed/${v.id}" title="${v.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        `).join('');
    })();
    </script>
</body>
</html>
